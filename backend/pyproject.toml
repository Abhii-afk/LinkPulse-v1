[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkpulse-backend"
version = "0.1.0"
description = "LinkPulse FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "bcrypt>=4.2,<5",
    "fastapi>=0.115,<1",
    "PyJWT>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.20,<1",
    "qrcode[pil]>=8,<9",
    "redis>=5,<6",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "workers*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
